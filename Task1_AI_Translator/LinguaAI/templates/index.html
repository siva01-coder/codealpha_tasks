<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LinguaAI — Intelligent Multilingual Translation</title>
    <meta name="description" content="Production-quality AI language translation powered by DeepL API. Clean, fast, and accessible translation app.">
    <!-- Google Fonts Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="app-wrapper">
        <!-- Toast Error / Notification Banner -->
        <div id="toast-container" class="toast-container" aria-live="polite"></div>

        <!-- Header -->
        <header class="app-header">
            <div class="brand-container">
                <h1 class="brand-logo">
                    <span class="logo-lingua">LINGUA</span><span class="logo-ai">AI</span>
                </h1>
                <p class="brand-subtitle">Intelligent multilingual translation</p>
            </div>
            <div class="status-indicator-pill" title="DeepL NMT Engine Ready">
                <span class="status-dot">●</span>
                <span class="status-text">Translation engine online</span>
            </div>
        </header>

        <!-- Main Translator Workspace -->
        <main class="translator-container">
            <!-- Language Selector Bar -->
            <section class="language-bar" aria-label="Language selection controls">
                <div class="lang-select-group">
                    <label for="source-lang-select" class="lang-label">FROM</label>
                    <div class="select-wrapper">
                        <select id="source-lang-select" aria-label="Select source language">
                            <option value="auto">Auto Detect</option>
                        </select>
                    </div>
                </div>

                <button id="swap-btn" class="icon-btn swap-btn" title="Swap source and target languages" aria-label="Swap source and target languages">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M7 16V4M7 4L3 8M7 4L11 8M17 8V20M17 20L21 16M17 20L13 16"/>
                    </svg>
                </button>

                <div class="lang-select-group">
                    <label for="target-lang-select" class="lang-label">TO</label>
                    <div class="select-wrapper">
                        <select id="target-lang-select" aria-label="Select target language">
                            <!-- Populated dynamically -->
                        </select>
                    </div>
                </div>
            </section>

            <!-- Text Panels Grid -->
            <section class="panels-grid">
                <!-- Left Input Panel -->
                <div class="panel input-panel">
                    <div class="panel-header">
                        <h2 class="panel-title">YOUR TEXT</h2>
                        <span id="char-counter" class="char-counter">0 / 5000</span>
                    </div>
                    <div class="textarea-wrapper">
                        <textarea 
                            id="source-text" 
                            class="translator-textarea" 
                            placeholder="Enter text to translate..." 
                            maxlength="5000"
                            aria-label="Text to translate"
                            spellcheck="true"
                        ></textarea>
                    </div>
                    <div class="panel-footer">
                        <div class="detected-badge-container">
                            <span id="detected-lang-banner" class="detected-lang-banner" style="display: none;">
                                Detected language: <strong id="detected-lang-name">EN</strong>
                            </span>
                        </div>
                        <div class="footer-actions">
                            <button id="clear-btn" class="action-btn text-btn" title="Clear text">
                                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <line x1="18" y1="6" x2="6" y2="18"></line>
                                    <line x1="6" y1="6" x2="18" y2="18"></line>
                                </svg>
                                Clear
                            </button>
                            <button id="listen-source-btn" class="action-btn text-btn" title="Listen to source text">
                                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                                    <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
                                </svg>
                                Listen
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Right Output Panel -->
                <div class="panel output-panel">
                    <div class="panel-header">
                        <h2 class="panel-title">TRANSLATION</h2>
                        <span id="status-badge" class="status-badge">Ready</span>
                    </div>
                    <div class="textarea-wrapper">
                        <textarea 
                            id="target-text" 
                            class="translator-textarea" 
                            placeholder="Your translation will appear here..." 
                            readonly
                            aria-label="Translated text"
                        ></textarea>
                    </div>
                    <div class="panel-footer align-right">
                        <div class="footer-actions">
                            <button id="copy-btn" class="action-btn text-btn" title="Copy translation to clipboard">
                                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                                    <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                                </svg>
                                <span id="copy-btn-text">Copy</span>
                            </button>
                            <button id="listen-target-btn" class="action-btn text-btn" title="Listen to translated text">
                                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                                    <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
                                </svg>
                                Listen
                            </button>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Primary Translate Action Button -->
            <section class="action-bar">
                <button id="translate-btn" class="translate-primary-btn" aria-label="Translate text">
                    <span id="translate-btn-spinner" class="spinner" style="display: none;"></span>
                    <span id="translate-btn-text">TRANSLATE</span>
                </button>
            </section>
        </main>

        <!-- Footer -->
        <footer class="app-footer">
            <p>LinguaAI &copy; CodeAlpha AI Internship Task 1 &bull; Powered by DeepL Neural Machine Translation</p>
        </footer>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
